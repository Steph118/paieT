<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

<ui:composition template="/paie/templates/layout-details.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="entityId" value="#{roleBean.entityId}"/>
            <f:viewAction action="#{roleBean.initDetails()}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="crudBean" value="#{roleBean}"/>

    <ui:param name="fieldsTitle" value=""/>

    <ui:define name="list-title">
    </ui:define>
    <ui:define name="breadCrumb">
    </ui:define>
    <ui:define name="fields-content">
        <p:outputPanel>
            <div class="form-grid grid">
                <div class="field flex flex-column col-12">
                    <p:outputLabel value="#{msg['roles.label']}" for="label"/>
                    <p:outputLabel class="font-bold text-900 text-xl" id="label"
                                   value="#{roleBean.entity.label}"/>
                </div>
                <div class="col-12">
                    <p:outputLabel value="#{msg['permissions']}"/>
                    <ui:repeat value="#{roleBean.entity.permissions}" var="perm">
                        <div class="field flex flex-column col-6 sm:col-6 col-12 md:col-2 lg:col-2">
                            <p:outputLabel class="font-bold text-900 text-xl" id="permissions" value="#{perm.label}"/>
                        </div>
                    </ui:repeat>
                </div>


            </div>
        </p:outputPanel>
    </ui:define>
</ui:composition>
</html>
