<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/paie/templates/layout-details.xhtml">
        <ui:define name="metadata">
            <f:metadata>
                <f:viewParam name="entityId" value="#{roleBean.entityId}"/>
                <f:viewAction action="#{roleBean.initDetails()}"/>
            </f:metadata>
        </ui:define>

        <ui:param name="crudBean" value="#{roleBean}"/>

        <ui:param name="fieldsTitle" value=""/>

        <ui:define name="list-title">
        </ui:define>
        <ui:define name="breadCrumb">
        </ui:define>
        <ui:define name="fields-content">
            <p:outputPanel>
                <div class="form-grid grid">
                    <div class="field flex flex-column sm:col-12 col-12 md:col-4 lg:col-4">
                        <p:outputLabel value="#{msg['persons.edit.firstname']}" for="firstname"/>
                        <p:outputLabel class="font-bold text-900 text-xl" id="firstname" value="#{roleBean.entity.label}"/>
                    </div>

                    <ui:repeat value="#{roleBean.entity.permissions}" var="perm">
                        <div class="field flex flex-column sm:col-12 col-12 md:col-4 lg:col-4">
                            <p:outputLabel class="font-bold text-900 text-xl" id="firstname" value="#{perm.label}"/>
                        </div>
                    </ui:repeat>



                </div>
            </p:outputPanel>
        </ui:define>
    </ui:composition>
</html>
