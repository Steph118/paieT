<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"

      xmlns:p="primefaces">
<ui:composition template="/paie/templates/layout-list.xhtml">

    <ui:param name="crudBean" value="#{roleBean}"/>

    <ui:define name="list-title">
        #{msg['roles.title']}
    </ui:define>
    <ui:define name="breadCrumb">
        #{msg['roles.breadCrumb']}
    </ui:define>
    <ui:define name="table-title">
        #{msg['roles.title']}
    </ui:define>
    <ui:define name="add-column">
        <p:column headerText="#{msg['filter-by-label']}" sortBy="#{e.label}"
                  filterBy="#{e.label}" filterMatchMode="contains" filterPlaceholder="#{msg['filter-by-label']}">
            <p:outputLabel value="#{e.label}"/>
        </p:column>
    </ui:define>
</ui:composition>
