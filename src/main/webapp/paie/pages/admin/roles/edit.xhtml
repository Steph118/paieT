<ui:composition
    xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    template="/paie/templates/layout-edit.xhtml"
    xmlns:h="jakarta.faces.html">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="entityId" value="#{roleBean.entityId}"/>
            <f:viewAction action="#{roleBean.initEntity()}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="crudBean" value="#{roleBean}"/>

    <ui:param name="fieldsTitle" value="#{msg['roles.title']}"/>

    <ui:define name="list-title">
        #{msg['roles.edit.title']}
    </ui:define>
    <ui:define name="breadCrumb">
        #{msg['roles.breadCrumb']}
    </ui:define>
    <ui:define name="fields-content">
        <div class="field col-12">
            <p:outputLabel value="#{msg['label']}" for="label"/>
            <p:inputText id="label" class="w-full" placeholder="#{msg['label.edit']}"
                         value="#{roleBean.entity.label}"
                         required="true" requiredMessage="#{msg['label.required']}"/>
        </div>
        <div class="field col-12">
            <h5>
                #{msg['permissions']}
            </h5>
                <ui:repeat value="#{roleBean.perms}" var="c"  >
                    <p:panel header="#{c.label}" toggleable="true" toggleSpeed="0">
                        <p:selectManyCheckbox id="permissions"
                                              value="#{roleBean.permsSelected}" layout="responsive"
                                              converter="omnifaces.SelectItemsConverter"
                                              >
                            <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}" />
                            <f:selectItems value="#{c.permissions}" var="perm" itemLabel="#{perm.label}"
                                           itemValue="#{perm.id}"/>
                            
                        </p:selectManyCheckbox>
                    </p:panel>

                </ui:repeat>
        </div>
    </ui:define>
</ui:composition>
