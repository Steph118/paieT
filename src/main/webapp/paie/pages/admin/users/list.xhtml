<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">
    <ui:composition template="/paie/templates/layout-list.xhtml">

        <ui:param name="crudBean" value="#{userBean}"/>

        <ui:define name="list-title">
        </ui:define>
        <ui:define name="breadCrumb">
        </ui:define>
        <ui:define name="table-title">
        </ui:define>
        <ui:define name="add-column">
            <p:column headerText="#{msg['user.title']}" sortBy="#{e.username}" 
                      filterBy="#{e.username}" filterMatchMode="contains" filterPlaceholder="Filter by username">
                <p:outputLabel value="#{e.username}"/>
            </p:column>
            <p:column headerText="#{msg['user.title']}" sortBy="#{e.actif}" 
                      filterBy="#{e.actif}" filterMatchMode="contains" filterPlaceholder="Filter by actif">
                <p:outputLabel value="#{e.actif ? 'Oui' : 'Non'}"/>
            </p:column>
        </ui:define>
    </ui:composition>
</html>
