<ui:composition
        xmlns:f="jakarta.faces.core"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui"
        template="/paie/templates/layout-edit.xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:oou="http://omnifaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="entityId" value="#{userBean.entityId}"/>
            <f:viewAction action="#{userBean.initEntity()}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="crudBean" value="#{userBean}"/>

    <ui:param name="fieldsTitle" value=" #{msg['user.title']}"/>

    <ui:define name="list-title">
        #{msg['user.title']}
    </ui:define>
    <ui:define name="breadCrumb">
        #{msg['user.title']}
    </ui:define>
    <ui:define name="fields-content">
        <div class="field col-12">
            <p:outputLabel value="#{msg['users.edit.username']}" for="username"/>
            <p:outputLabel id="username" class="w-full font-bold text-900 text-xl"
                           value="#{userBean.entity.userName}"/>
        </div>
        <div class="col-12">
            <h4>* Changer de mot de passe</h4>
        </div>
        <div class="field sm:col-12 col-12 md:col-6 lg:col-6">
            <p:outputLabel value="#{msg['users.edit.password']}" for="password"/>
            <p:password id="password" class="w-full" placeholder="#{msg['users.edit.password.placeholder']}"
                        value="#{userBean.entity.password}"
                        required="true" requiredMessage="#{msg['users.edit.password.required']}"/>
        </div>


        <div class="field sm:col-12 col-12 md:col- lg:col-6">
            <p:outputLabel value="#{msg['users.edit.confirm.password']}" for="confirm"/>
            <p:password id="confirm" class="w-full" placeholder="#{msg['users.edit.confirm.password']}"
                        value="#{userBean.confirmPassword}"
                        required="true" requiredMessage="#{msg['users.edit.confirm.password.required']}">

            </p:password>
        </div>
        <h:panelGroup>
            <oou:validateEqual id="equal" components="password confirm"
                               message="#{msg['confirm.password.error']}"/>
        </h:panelGroup>


        <div class="ui-g grid mt-2 ">
            <div class="ui-g-12 col-12 ">
                <h4 class="">* Generer un mot de passe</h4>
                <div class="col-12">
                    <p:commandButton value="Envoyer" action="#{userBean.sendPasswordByMail()}"
                                     process="@this"
                                     styleClass="ui-confirmdialog-yes" icon="pi pi-envelope"/>
                    <small>Envoyer le mot de passe par mail.</small>
                </div>

            </div>
        </div>

        <div class="col-12">
            <div class="sm:col-6 col-6 md:col-3 lg:col-3">
                <div class="pb-2">
                    <p:outputLabel value="#{msg['user.actif']}" for="actif"/>
                </div>
                <p:toggleSwitch id="actif"
                                onIcon="pi pi-check" offIcon="pi pi-power" value="#{userBean.entity.actif}"/>
            </div>

            <div class="sm:col-6 col-6 md:col-3 lg:col-3">
                <div class="pb-2">
                    <p:outputLabel value="#{msg['user.change.password']}" for="actif"/>
                </div>
                <p:toggleSwitch id="changePwd"
                                onIcon="pi pi-check" offIcon="pi pi-power" value="#{userBean.entity.changePassword}"/>
            </div>
        </div>


    </ui:define>

    <ui:define name="updateBtn">
        <p:commandButton value="#{msg['save.button']}" icon="fa fa-edit"
                         class="ui-button-primary"
                         action="#{userBean.changePassword()}"
        >
            <p:confirm header="#{msg['confirmer.label']}" icon="ui-icon-alert"
                       message="#{msg['confirmer.placeholder']}"/>
        </p:commandButton>
    </ui:define>

</ui:composition>
