<ui:composition
    xmlns:f="jakarta.faces.core"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/paie/templates/layout-edit.xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:oou="http://omnifaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="entityId" value="#{userBean.entityId}"/>
            <f:viewAction action="#{userBean.initEntity()}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="crudBean" value="#{userBean}"/>

    <ui:param name="fieldsTitle" value=" #{msg['user.title']}"/>

    <ui:define name="list-title">
        #{msg['user.title']}
    </ui:define>
    <ui:define name="breadCrumb">
        #{msg['user.title']}
    </ui:define>
    <ui:define name="fields-content">
        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel value="#{msg['users.edit.username']}" for="username"/>
            <p:inputText id="username" class="w-full" placeholder="#{msg['users.edit.username.placeholder']}"
                         value="#{userBean.entity.userName}" disabled="#{!userBean.updating}"
                         required="true" requiredMessage="#{msg['users.edit.username.required']}"/>
        </div>

        <ui:fragment rendered="#{!userBean.updating}">
            <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
                <p:outputLabel value="#{msg['users.edit.password']}" for="password"/>
                <p:password id="password" class="w-full" placeholder="#{msg['users.edit.password.placeholder']}"
                            value="#{userBean.entity.password}" disabled="#{userBean.updating}"
                            required="true" requiredMessage="#{msg['users.edit.password.required']}"/>
            </div>

            <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
                <p:outputLabel value="#{msg['users.edit.confirm.password']}" for="confirm"/>
                <p:password id="confirm" class="w-full" placeholder="#{msg['users.edit.confirm.password']}"
                            value="#{userBean.confirmPassword}" disabled="#{userBean.updating}"
                            required="true" requiredMessage="#{msg['users.edit.confirm.password.required']}">

                </p:password>
            </div>
            <h:panelGroup>
                <oou:validateEqual id="equal" components="password confirm" 
                                   message="#{msg['confirm.password.error']}" />
            </h:panelGroup>
        </ui:fragment>

        <div class="field col-12">
            <div class="pb-2">
                <p:outputLabel value="#{msg['user.actif']}" for="actif"/>
            </div>
            <p:toggleSwitch id="actif" 
                            onIcon="pi pi-check" offIcon="pi pi-power"  value="#{userBean.entity.actif}"/>
        </div>

        <div class="field col-12">
            <p:panel toggleable="true"  header="#{msg['roles.title']}">
                <p:selectCheckboxMenu id="roles" value="#{userBean.entity.roles}"
                                      converter="omnifaces.SelectItemsConverter" multiple="true" 
                                      scrollHeight="250" updateLabel="true"
                                      filter="true" filterMatchMode="contains" filterNormalize="true"
                                      dynamic="true" emptyLabel="#{msg['choice-label']}" label="#{msg['roles.title']}"
                                      required="true" requiredMessage="#{msg['roles.required']}">
                    <f:selectItems value="#{userBean.roles}" itemLabel="#{r.label}" itemValue="#{r}"
                                   var="r" />
                    <f:facet name="footer">
                        <h:outputText value="#{msg['sum']} :  #{userBean.roles.size()}"
                                      styleClass="py-1 block font-bold"/>
                    </f:facet>
                </p:selectCheckboxMenu>
            </p:panel>
        </div>

    </ui:define>

</ui:composition>
