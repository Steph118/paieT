<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="jakarta.faces.core">
<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        template="/paie/templates/layout-edit.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="entityId" value="#{variableBean.entityId}"/>
            <f:viewAction action="#{variableBean.initEntity()}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="crudBean" value="#{variableBean}"/>

    <ui:param name="fieldsTitle" value="#{msg['references.variable.title']}"/>

    <ui:define name="list-title">
        #{msg['references.variable.edit.title']}
    </ui:define>
    <ui:define name="breadCrumb">
        #{msg['references.variable.breadCrumb']}
    </ui:define>
    <ui:define name="fields-content">
        <div class="field sm:col-12 col-12 md:col-6 lg:col-6">
            <p:outputLabel value="#{msg['key']}" for="key"/>
            <p:inputText id="key" class="w-full" placeholder="#{msg['key.edit']}"
                         required="true" requiredMessage="#{msg['key.required']}"
                         value="#{variableBean.entity.key}"/>
        </div>
        <div class="field sm:col-12 col-12 md:col-6 lg:col-6">
            <p:outputLabel for="value" value="#{msg['value']}"/>
            <p:inputText id="value" class="w-full" placeholder="#{msg['value.edit']}"
                         required="true" requiredMessage="#{msg['value.required']}"
                         value="#{variableBean.entity.value}"/>
        </div>
    </ui:define>

</ui:composition>
</html>
