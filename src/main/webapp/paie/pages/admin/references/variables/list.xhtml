<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/paie/templates/layout-list.xhtml">
    <ui:param name="crudBean" value="#{variableBean}"/>
    <ui:define name="list-title">
        #{msg['key']}
    </ui:define>
    <ui:define name="breadCrumb">
        #{msg['value']}
    </ui:define>
    <ui:define name="table-title">
        #{msg['references.vaiabler.title']}
    </ui:define>
    <ui:define name="add-column">
        <p:column headerText="#{msg['key']}" filterBy="#{e.key}" filterMatchMode="contains"
                  field="key" sortBy="#{e.key}" filterPlaceholder="#{msg['filter-by-key']}">
            <p:outputLabel value="#{e.key}"/>
        </p:column>
        <p:column headerText="#{msg['value']}" sortBy="#{e.value}" filterBy="#{e.value}"
                  filterMatchMode="contains" field="value" filterPlaceholder="#{msg['filter-by-value']}">
            <p:outputLabel value="#{e.value}"/>
        </p:column>
    </ui:define>
</ui:composition>
</html>
