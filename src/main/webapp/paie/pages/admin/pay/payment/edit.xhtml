<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    template="/paie/templates/layout-edit.xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui">    
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="entityId" value="#{sumPaidBean.entityId}"/>
            <f:viewAction action="#{sumPaidBean.initEntity()}"/>
        </f:metadata>
    </ui:define>

    <ui:param name="crudBean" value="#{sumPaidBean}"/>

    <ui:param name="fieldsTitle" value="#{msg['payment.list.title']}"/>

    <ui:define name="list-title">
        #{msg['payment.list.title']}
    </ui:define>
    <ui:define name="breadCrumb" >
        #{msg['payment.list.breadCrumb']}
    </ui:define>
    <ui:define name="fields-content">
        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel for="eglise" value="#{msg['entites.eglise.title']}"/>
            <p:selectOneMenu id="eglise" class="w-full" filterMatchMode="startsWith"
                             filterNormalize="true" filter="true" filterPlaceholder="#{msg['search']}"
                             converter="omnifaces.SelectItemsConverter" required="true"
                             requiredMessage="#{msg['persons.edit.eglise.required']}"
                             value="#{sumPaidBean.eglise}">
                <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}"/>
                <f:selectItems value="#{sumPaidBean.eglises}" itemValue="#{e}" var="e" itemLabel="#{e.label}"/>
                <p:ajax listener="#{sumPaidBean.loadLoansAndMembers()}" update="loan membre sumPromised payment-bloc" process="@this"/>
            </p:selectOneMenu>
        </div>
        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel for="dpt" value="#{msg['departement.title']}"/>
            <p:selectOneMenu id="dpt" class="w-full" filterMatchMode="startsWith"
                             filterNormalize="true" filter="true" filterPlaceholder="#{msg['search']}"
                             converter="omnifaces.SelectItemsConverter" required="true"
                             requiredMessage="#{msg['persons.edit.departement.required']}" value="#{sumPaidBean.dptment}">
                <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}"/>
                <f:selectItems value="#{sumPaidBean.departments}" itemLabel="#{d.label}" var="d" itemValue="#{d}"/>
                <p:ajax update="membre sumPromised payment-bloc" listener="#{sumPaidBean.loadMembers()}" process="@this"/>
            </p:selectOneMenu>
        </div>

        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel for="membre" value="#{msg['member']}"/>
            <p:selectOneMenu id="membre" class="w-full" filterMatchMode="startsWith"
                             filterNormalize="true" filter="true" filterPlaceholder="#{msg['search']}"
                             converter="omnifaces.SelectItemsConverter" required="true"
                             requiredMessage="#{msg['member.required']}" value="#{sumPaidBean.member}">
                <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}"/>
                <f:selectItems value="#{sumPaidBean.membres}" itemLabel="#{m.fullPersonFromMember()}" var="m" itemValue="#{em}"/>
                <p:ajax update="sumPromised payment-bloc" listener="#{sumPaidBean.loadSumPromised()}" process="@this"/>
            </p:selectOneMenu>
        </div>

        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel for="loan" value="#{msg['loan.title']}"/>
            <p:selectOneMenu id="loan" class="w-full" filterMatchMode="startsWith" filterNormalize="true"
                             filter="true" filterPlaceholder="#{msg['search']}" required="true"
                             requiredMessage="#{msg['persons.edit.member.loan']}"
                             converter="omnifaces.SelectItemsConverter" value="#{sumPaidBean.loan}">
                <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}"/>
                <f:selectItems value="#{sumPaidBean.loans}" itemLabel="#{l.label}" var="l" itemValue="#{l}"/>
                <p:ajax update="sumPromised payment-bloc" listener="#{sumPaidBean.loadSumPromised()}" process="@this"/>
            </p:selectOneMenu>
        </div>

        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel for="year" value="#{msg['references.annee.title']}"/>
            <p:selectOneMenu id="year" class="w-full" filterMatchMode="startsWith" filterNormalize="true"
                             filter="true" filterPlaceholder="#{msg['search']}" required="true"
                             requiredMessage="#{msg['persons.edit.member.loan']}"
                             converter="omnifaces.SelectItemsConverter" value="#{sumPaidBean.year}">
                <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}"/>
                <f:selectItems value="#{sumPaidBean.years}" itemLabel="#{y.value}" var="y" itemValue="#{y}"/>
                <p:ajax update="sumPromised payment-bloc" listener="#{sumPaidBean.loadSumPromised()}" process="@this"/>
            </p:selectOneMenu>
        </div>

        <div class="field sm:col-12 col-12 md:col-4 lg:col-4">
            <p:outputLabel for="sumPromised" value="#{msg['promised.list.single.title']}"/>
            <p:inputText id="sumPromised" class="w-full bg-blue-50 bold text-1xl" requiredMessage="#{msg['promised.list.single.title']}"
                         disabled="true" value="#{sumPaidBean.formatSumPromised()}"  required="true" />
        </div>


        <p:fieldset class="w-full mt-3" legend="Paiements" rendered="true" id="payment-bloc">
            <div class="form-grid grid ui-fluid">
                <div class="field sm:col-12 col-12 md:col-6 lg:col-6">
                    <p:outputLabel for="month" value="#{msg['month.title']}"/>
                    <p:selectOneMenu id="month" class="w-full" filterMatchMode="startsWith" filterNormalize="true"
                                     filter="true" filterPlaceholder="#{msg['search']}" required="true"
                                     requiredMessage="#{msg['month.required']}" disabled="#{sumPaidBean.sumPromised == null}"
                                     converter="omnifaces.SelectItemsConverter" value="#{sumPaidBean.month}">
                        <f:selectItem noSelectionOption="true" itemLabel="#{msg['choice-label']}"/>
                        <f:selectItems value="#{sumPaidBean.months}" itemLabel="#{m.libelle}" var="m" itemValue="#{m}"/>
                        <p:ajax listener="#{sumPaidBean.loadSumPaid()}" process="@this" update="montantVersement table-pay"/>
                    </p:selectOneMenu>
                </div>
                <div class="field sm:col-12 col-12 md:col-5 lg:col-5">
                    <p:outputLabel for="montantVersement" value="#{msg['payment.edit.amount']}"/>
                    <p:inputNumber id="montantVersement" class="w-full" required="true"
                                   value="#{sumPaidBean.payment.amount}"
                                   requiredMessage="#{msg['payment.edit.amount.required']}"
                                   disabled="#{sumPaidBean.sumPromised == null}"/>
                </div>
                <div class="sm:col-12 col-12 md:col-1 lg:col-1 align-content-center align-items-center">
                    <p:commandButton id="addAmount"  class="mt-2 w-full" icon="fa fa-add" update="table-pay month montantVersement"
                                     disabled="#{sumPaidBean.sumPromised == null}"
                                     action="#{sumPaidBean.addToList()}" process="@this montantVersement month"/>
                </div>
            </div>

            <div class="mt-3">
                <p:panel header="Paiements à sauvegarder">
                    <p:dataTable id="table-pay" value="#{sumPaidBean.entity.payments}" var="pay">
                        <p:column headerText="Mois">
                            <p:outputLabel value="#{sumPaidBean.entity.month.libelle}"/>
                        </p:column>
                        <p:column headerText="Montant">
                            <p:outputLabel value="#{pay.amount}"/>
                        </p:column>
                        <p:column headerText="actions">
                            <p:commandButton id="deleteButton" class="ui-button-danger" process="deleteButton" rendered="#{pay.id == null}"
                                             update="table-pay" icon="pi pi-trash"  action="#{sumPaidBean.removeFromList(pay)}"/>

                            <p:commandButton id="deleteButton2" class="ui-button-danger" process="deleteButton2" rendered="#{pay.id != null}"
                                             update="table-pay" icon="pi pi-trash"  action="#{sumPaidBean.removeFromList(pay)}">
                                <p:confirm header="#{msg['confirmer.label']}" icon="ui-icon-alert"
                                           message="#{msg['confirmer.placeholder']}"/>
                                <p:confirm header="#{msg['confirmer.label']}" icon="ui-icon-alert"
                                           message="#{msg['confirmer.placeholder']}"/>
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>
                </p:panel>
            </div>
        </p:fieldset>
    </ui:define>

    <ui:define name="saveBtn">
        <p:commandButton value="#{msg['save.button']}" icon="fa fa-save"
                         class="ui-button-primary"
                         actionListener="#{crudBean.beforeSave()}"
                         action="#{sumPaidBean.save()}" process="@this"
                         rendered="#{!sumPaidBean.isUpdating()}">
            <p:confirm header="#{msg['confirmer.label']}" icon="ui-icon-alert"
                       message="#{msg['confirmer.placeholder']}"/>
            <p:confirm header="#{msg['confirmer.label']}" icon="ui-icon-alert"
                       message="#{msg['confirmer.placeholder']}"/>
        </p:commandButton>

    </ui:define>
</ui:composition>
